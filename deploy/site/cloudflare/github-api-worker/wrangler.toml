name = "stelarith-github-api-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 可选：配置 GITHUB_TOKEN 密钥后，调用方无需在请求里带令牌，Worker 自动注入。
# 在 Cloudflare 控制台 Workers → 该 Worker → Settings → Variables → 添加 secret：
#   名称 GITHUB_TOKEN，值 = 你的 GitHub PAT（细粒度，只需 Contents/Metadata/Releases 读权限）。
# 不配置也行：站点侧 github.ts 会自行在请求头带 Bearer 令牌。

# 自定义域（推荐）：绑定 gh-api.245959623.xyz 这类子域，这样 GITHUB_API_BASE 用你自己的域名。
# routes = [
#   { pattern = "gh-api.245959623.xyz", custom_domain = true }
# ]
